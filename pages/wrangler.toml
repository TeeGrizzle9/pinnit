# pinnit.pages.dev: a short, free address for Pinnit.
# This Cloudflare Pages project holds no app of its own. Every request is handed straight to the
# "pinnit" Worker (the real app, database and API) through a service binding, so there is still
# only one app and one database. Cloudflare dashboard: Pages project "pinnit", root directory "pages".
name = "pinnit"
pages_build_output_dir = "./public"
compatibility_date = "2025-09-01"

[[services]]
binding = "PINNIT"
service = "pinnit"
