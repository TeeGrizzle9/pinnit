/* comfort settings applied before first paint */
try { (JSON.parse(localStorage.getItem('pinnit_comfort')) || []).forEach(c => document.documentElement.classList.add(c)); } catch {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
/* Pinnit brand: Park Green #1E9E6A, Forest Ink #10302A, Mint #F3FAF6, Sunshine #FFC94D, Nunito */
:root{
  --ink:#10302A;--fg:var(--ink);--muted:#536862;--line:#d9e7df;--soft:#edf6f1;--soft2:#dfeee6;--mint:#F3FAF6;
  --green:#1E9E6A;--green-d:#157A51;--sun:#FFC94D;--sun-soft:#fff3d1;--red:#c8361b;--blue:#276ef1;
  --shadow:0 8px 28px rgba(0,0,0,.16);--shadow-sm:0 2px 10px rgba(0,0,0,.12);
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#fff;color:var(--fg);font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit}
.hidden{display:none!important}
#map{position:fixed;inset:0;background:#e9ecef}
.leaflet-container{font-family:inherit}
.raster-map .leaflet-tile-pane{filter:saturate(.55) brightness(1.04)}
.leaflet-top{top:calc(76px + var(--safe-t))}
.leaflet-control-attribution{font-size:10px;background:rgba(255,255,255,.8)!important;border-radius:6px 0 0 6px}
.leaflet-control-zoom{border:0!important;box-shadow:var(--shadow-sm)!important;border-radius:12px!important;overflow:hidden}
.leaflet-control-zoom a{width:40px!important;height:40px!important;line-height:40px!important;color:var(--ink)!important;border-color:var(--line)!important}

/* top bar */
.topbar{position:fixed;z-index:1200;top:calc(12px + var(--safe-t));left:12px;right:12px;display:flex;gap:10px;align-items:flex-start}
.search{position:relative;flex:1;min-width:0;max-width:460px}
.search-box{display:flex;align-items:center;gap:10px;height:52px;padding:0 16px;background:#fff;border-radius:999px;box-shadow:var(--shadow)}
.search-box svg{flex:none}
.search-box input{flex:1;border:0;outline:0;background:transparent;font-size:16px;font-weight:500;min-width:0}
.search-box input::placeholder{color:#8a8a8a}
.brand{display:flex;align-items:center;padding-right:12px;border-right:1px solid var(--line)}
.brand img{height:28px;width:auto;display:block}
.results{position:absolute;top:60px;left:0;right:0;background:#fff;border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.results button{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:13px 16px;border-bottom:1px solid var(--soft)}
.results button:last-child{border-bottom:0}
.results button:hover{background:var(--soft)}
.ric{width:34px;height:34px;border-radius:50%;background:var(--soft);display:grid;place-items:center;flex:none}
.results strong{display:block;font-size:15px;font-weight:600}
.results span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px}
.round{position:relative;width:52px;height:52px;border-radius:50%;background:#fff;box-shadow:var(--shadow);display:grid;place-items:center;flex:none;font-weight:700;overflow:visible}
.round .avatar{width:52px;height:52px;font-size:17px}
.round .notif{position:absolute;top:0;right:0;width:14px;height:14px;border-radius:50%;background:var(--red);border:2px solid #fff}
.locate{position:fixed;z-index:1150;right:12px;bottom:calc(var(--sheet-h,220px) + 14px);transition:bottom .3s ease}

/* avatars */
.avatar{border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;flex:none;overflow:hidden;object-fit:cover;width:36px;height:36px;font-size:13px;letter-spacing:.02em}
img.avatar{background:var(--soft)}
.stack{display:flex}
.stack .avatar{width:24px;height:24px;font-size:9px;border:2px solid #fff;margin-left:-7px}
.stack .avatar:first-child{margin-left:0}

/* main sheet */
.sheet{position:fixed;z-index:1100;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -6px 30px rgba(0,0,0,.14);padding:8px 16px calc(16px + var(--safe-b));display:flex;flex-direction:column;max-height:84vh}
.handle{display:block;width:100%;padding:6px 0 10px;touch-action:none;cursor:grab}
.sheet.dragging{transition:none!important}
.sheet{transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.handle::before{content:"";display:block;margin:0 auto;width:40px;height:5px;border-radius:9px;background:#d6d6d6}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:4px;margin-bottom:12px}
.seg button{flex:1;height:36px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:12px}
.sheet-head h2{margin:0;font-size:24px;font-weight:700;letter-spacing:-.02em}
.sub{margin:3px 0 0;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.live-dot-s{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block}
.pill-btn{height:36px;padding:0 14px;border-radius:999px;background:var(--soft);font-size:14px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.pill-btn:hover{background:var(--soft2)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 10px;padding:0 16px}
/* the sheet's filter row wraps so every option is visible on narrow phones */
#catChips{flex-wrap:wrap;overflow:visible;gap:6px;margin:0 0 10px;padding:0}
#catChips .chip{height:34px;padding:0 11px;font-size:13.5px;gap:5px}
#catChips .chip.on{box-shadow:inset 0 -3px 0 var(--c,transparent)}
.tag.example{background:var(--sun-soft);color:#6b4d00}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
.chip{flex:none;height:38px;padding:0 14px;border-radius:999px;background:var(--soft);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:background .15s;white-space:nowrap}
.chip:hover{background:var(--soft2)}
.chip.on{background:var(--ink);color:#fff}
.chip .badge-n{background:#fff;color:var(--ink);border-radius:999px;font-size:11px;padding:1px 6px}
.chips.small .chip{height:34px;font-size:13px;padding:0 12px}
.list{overflow-y:auto;margin:0 -16px;padding:2px 16px 8px;flex:1;min-height:0}
.sheet:not(.expanded) .list{display:none}
.card{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:14px 0;border-bottom:1px solid var(--soft)}
.card:last-child{border-bottom:0}
.card-ic{width:50px;height:50px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-size:25px;flex:none;position:relative}
.card-ic .ld{position:absolute;top:-2px;right:-2px;width:12px;height:12px;border-radius:50%;background:var(--green);border:2px solid #fff}
.card-body{flex:1;min-width:0}
.card-body strong{display:block;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-body .ln{display:block;font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-body .when{color:var(--ink);font-weight:500}
.card-body .when.live{color:var(--green-d)}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;align-items:center}
.tag{font-size:11px;font-weight:600;background:var(--soft);border-radius:6px;padding:3px 7px;white-space:nowrap}
.tag.dark{background:var(--ink);color:#fff}
.tag.green{background:#dff3e8;color:var(--green-d)}
.card-side{text-align:right;flex:none}
.card-side b{display:block;font-size:15px}
.card-side small{font-size:12px;color:var(--muted)}
.empty{padding:28px 8px;text-align:center;color:var(--muted);font-size:14px;line-height:1.5}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

.btn{height:56px;border-radius:14px;font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;transition:transform .08s,opacity .15s,background .15s;text-decoration:none}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--green);color:#fff;font-weight:800}
.btn.primary:hover{background:var(--green-d)}
.btn.sm.primary{background:var(--green-d)}
.btn.dark{background:var(--ink);color:#fff}
.btn.secondary{background:var(--soft);color:var(--ink)}
.btn.secondary:hover{background:var(--soft2)}
.btn.danger{background:#fff;color:var(--red);border:1.5px solid #f3c7c0}
.btn.green{background:var(--green);color:#fff}
.btn.sm{height:40px;font-size:14px;border-radius:10px;width:auto;padding:0 14px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-row{display:flex;gap:10px}
.btn-row .btn{height:48px;font-size:15px}
#dropBtn{margin-top:4px;flex:none}

/* placement */
/* the pin you move around: the Pinnit pin with its three people, green on a public space, red where it can't go */
.center-pin{--pin:var(--ink);position:fixed;z-index:1050;left:50%;top:50%;transform:translate(-50%,-100%);pointer-events:none;display:flex;flex-direction:column;align-items:center}
.center-pin svg{width:50px;height:70px;display:block;filter:drop-shadow(0 4px 6px rgba(16,48,42,.35));transition:transform .2s}
.center-pin svg .body{fill:var(--pin);transition:fill .2s}
.center-pin svg .ring{stroke:var(--pin);transition:stroke .2s}
.center-pin.ok{--pin:var(--green)}
.center-pin.bad{--pin:#d93a1e}
.center-pin.moving svg{transform:translateY(-12px)}
.center-pin::after{content:"";position:absolute;bottom:-3px;width:14px;height:6px;border-radius:50%;background:rgba(16,48,42,.35)}
.place-bar{position:fixed;z-index:1200;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -6px 30px rgba(0,0,0,.14);padding:20px 16px calc(16px + var(--safe-b))}
.place-bar small{font-size:13px;color:var(--muted)}
.place-bar strong{display:block;font-size:19px;font-weight:600;margin:3px 0 16px;letter-spacing:-.01em;min-height:24px}
.place-bar .btn+.btn{margin-top:8px}
/* spot notice drops down from the top, so the pin and the map stay in view */
.spot-drop{position:fixed;z-index:1210;top:calc(76px + var(--safe-t));left:12px;right:12px;max-width:460px;margin:0 auto;pointer-events:none}
.spot-drop .spot{pointer-events:auto;margin:0;box-shadow:var(--shadow);animation:drop .22s cubic-bezier(.2,.8,.2,1)}
@keyframes drop{from{transform:translateY(-12px);opacity:0}}
.spot{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:11px 13px;font-size:14px;line-height:1.35;background:#fff;color:var(--muted)}
.spot i{font-style:normal;font-size:18px;line-height:1.1;flex:none}
.spot b{display:block;color:inherit}
.spot.ok{background:#e9f7ef;color:var(--green-d)}
.spot.bad{background:#fdecea;color:#a51400}
.spot.warn{background:#fff6e0;color:#7a5200}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sugg button{background:#fff;border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}

/* markers: ring colour = category, filled = live */
.pin{--c:var(--ink);position:relative;width:40px;height:40px;border-radius:50%;background:#fff;border:3px solid var(--c);box-shadow:0 3px 10px rgba(0,0,0,.3);display:grid;place-items:center;font-size:19px;line-height:1;transition:transform .15s}
.pin::after{content:"";position:absolute;left:50%;bottom:-8px;width:10px;height:10px;background:#fff;transform:translateX(-50%) rotate(45deg);border-right:3px solid var(--c);border-bottom:3px solid var(--c);z-index:-1}
.pin.live{background:var(--c);border-color:#fff}
.pin.live::after{background:var(--c);border-color:#fff}
.pin.live::before{content:"";position:absolute;inset:-9px;border-radius:50%;border:3px solid var(--green);animation:pulse 1.8s ease-out infinite}
.pin.sel{transform:scale(1.2)}
.pin.mine{box-shadow:0 0 0 3px var(--green),0 3px 10px rgba(0,0,0,.3)}
.pin .count{position:absolute;top:-8px;right:-12px;background:var(--ink);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:2px 6px;border:2px solid #fff;font-family:Nunito,sans-serif;white-space:nowrap}
.pin.live .count{background:var(--green)}
.vpin{position:relative;width:32px;height:32px;border-radius:10px;background:#fff;border:2px solid var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.25);display:grid;place-items:center;font-size:16px;line-height:1;transition:transform .15s}
.vpin.dim{opacity:.85;border-color:#777}
.vpin.sel{transform:scale(1.18)}
.vpin.open::before{content:"";position:absolute;top:-5px;right:-5px;width:12px;height:12px;border-radius:50%;background:var(--green);border:2px solid #fff}
.vpin .vprice{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:3px;background:var(--ink);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:999px;white-space:nowrap;font-family:Nunito,sans-serif}
.chip .cdot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.chip.on .cdot{box-shadow:0 0 0 2px #fff}
@keyframes pulse{0%{transform:scale(.8);opacity:1}100%{transform:scale(1.5);opacity:0}}
.me-dot{width:18px;height:18px;border-radius:50%;background:var(--blue);border:3px solid #fff;box-shadow:0 0 0 6px rgba(39,110,241,.2),0 2px 6px rgba(0,0,0,.3)}
.ci-mark{display:flex;flex-direction:column;align-items:center}
.ci-mark .avatar{width:34px;height:34px;font-size:12px;border:3px solid var(--blue);box-shadow:0 2px 8px rgba(0,0,0,.3)}
.ci-mark span{margin-top:3px;background:var(--blue);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:2px 7px;white-space:nowrap;font-family:Nunito,sans-serif}

/* modal sheets */
.scrim{position:fixed;inset:0;z-index:1300;background:rgba(0,0,0,.4);animation:fade .2s}
.modal{position:fixed;z-index:1400;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;background:#fff;border-radius:22px 22px 0 0;padding:8px 20px calc(20px + var(--safe-b));box-shadow:0 -6px 30px rgba(0,0,0,.2);animation:up .28s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain}
.modal.chat-mode{display:flex;flex-direction:column;height:88vh;overflow:hidden;padding-bottom:calc(12px + var(--safe-b))}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
.grab{width:40px;height:5px;border-radius:9px;background:#d6d6d6;margin:4px auto 14px;flex:none}
.m-top{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex:none}
.m-top h3{margin:0;font-size:24px;font-weight:700;letter-spacing:-.02em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x{width:40px;height:40px;border-radius:50%;background:var(--soft);display:grid;place-items:center;flex:none}
.x:hover{background:var(--soft2)}
.lbl{display:block;font-size:14px;font-weight:600;margin:20px 0 8px}
.lbl em{font-style:normal;color:var(--muted);font-weight:500}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0}
.field{width:100%;height:52px;border-radius:12px;background:var(--soft);border:2px solid transparent;padding:0 14px;font-size:16px;outline:0;transition:border .15s,background .15s}
.field:focus{border-color:var(--ink);background:#fff}
textarea.field{height:92px;padding:12px 14px;resize:none;line-height:1.4}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.act-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.act-opt{border-radius:14px;background:var(--soft);padding:10px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;border:2px solid transparent;text-align:center;line-height:1.15}
.act-opt i{font-style:normal;font-size:24px;line-height:1}
.act-opt.on{border-color:var(--ink);background:#fff}
.stepper{display:flex;align-items:center;justify-content:space-between;background:var(--soft);border-radius:12px;height:52px;padding:0 6px}
.stepper button{width:40px;height:40px;border-radius:50%;background:#fff;font-size:22px;font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.stepper output{font-size:18px;font-weight:700}
.loc-row{display:flex;align-items:center;gap:12px;background:var(--soft);border-radius:12px;padding:12px 14px}
.loc-row div{flex:1;min-width:0}
.loc-row strong{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loc-row span{font-size:12px;color:var(--muted)}
.loc-row button{font-weight:600;font-size:14px;text-decoration:underline}
.cost-wrap{position:relative}
.cost-wrap span{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-weight:600;color:var(--muted)}
.cost-wrap .field{padding-left:28px}
.form-foot{position:sticky;bottom:calc(-20px - var(--safe-b));background:#fff;padding:16px 0 calc(4px + var(--safe-b));margin-top:14px;z-index:2}
.err{color:var(--red);font-size:14px;font-weight:500;margin:10px 0 0}
.ok-msg{color:var(--green-d);font-size:14px;font-weight:500;margin:10px 0 0}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--soft);width:100%;text-align:left}
.toggle strong{display:block;font-size:15px;font-weight:600}
.toggle span{display:block;font-size:13px;color:var(--muted);margin-top:1px}
.switch{width:50px;height:30px;border-radius:999px;background:#d6d6d6;position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.toggle.on .switch{background:var(--green)}
.toggle.on .switch::after{transform:translateX(20px)}

/* detail */
.d-head{display:flex;gap:14px;align-items:flex-start}
.d-icon{width:60px;height:60px;border-radius:16px;background:var(--soft);display:grid;place-items:center;font-size:32px;flex:none}
.d-titles{flex:1;min-width:0}
.eyebrow{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;align-items:center;gap:6px}
.eyebrow.live{color:var(--green-d)}
.eyebrow .dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.3}}
.d-titles h3{margin:3px 0 2px;font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.2;word-wrap:break-word}
.d-titles p{margin:0;color:var(--muted);font-size:14px}
.friends-going{display:flex;align-items:center;gap:10px;background:#dff3e8;color:var(--green-d);border-radius:12px;padding:10px 12px;margin-top:14px;font-size:14px;font-weight:600}
.rows{margin:14px 0 6px;border-top:1px solid var(--soft)}
.row{display:flex;gap:14px;align-items:center;padding:13px 0;border-bottom:1px solid var(--soft)}
.row .ri{width:36px;height:36px;border-radius:50%;background:var(--soft);display:grid;place-items:center;flex:none}
.row > div:last-child{min-width:0}
.row strong{display:block;font-size:15px;font-weight:600}
.row span{display:block;font-size:13px;color:var(--muted);margin-top:1px}
.row span.good{color:var(--green-d);font-weight:600}
.row span.bad{color:var(--red);font-weight:600}
.bar{height:6px;background:var(--soft);border-radius:9px;overflow:hidden;margin:14px 0 12px}
.bar span{display:block;height:100%;background:var(--green);border-radius:9px;transition:width .3s}
.bar.full span{background:var(--green)}
.people{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.pchip{height:36px;padding:0 12px 0 4px;border-radius:999px;background:var(--soft);display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;position:relative}
.pchip .avatar{width:28px;height:28px;font-size:10px}
.pchip.me .avatar{outline:2px solid var(--green)}
.pchip .arr{width:8px;height:8px;border-radius:50%;background:var(--green)}
.host-card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--soft);border-radius:14px;padding:12px;margin:14px 0 4px}
.host-card .avatar{width:44px;height:44px;font-size:15px}
.host-card div{flex:1;min-width:0}
.host-card strong{display:block;font-size:15px}
.host-card div span{font-size:13px;color:var(--muted)}
.notes{background:var(--soft);border-radius:14px;padding:14px;margin:12px 0 4px;font-size:15px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
.notes b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px}
.sec-t{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin:18px 0 8px}
.d-actions{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.here-box{background:#eaf1fe;border-radius:14px;padding:12px 14px;font-size:14px;color:#1b4fb0;line-height:1.4}
.here-box b{display:block;color:#0e3a8a}

/* chat */
.chat-list{flex:1;overflow-y:auto;margin:6px -20px 0;padding:8px 20px;display:flex;flex-direction:column;gap:6px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:84%}
.msg .avatar{width:28px;height:28px;font-size:10px}
.msg .bub{background:var(--soft);border-radius:18px 18px 18px 6px;padding:9px 13px;font-size:15px;line-height:1.35;white-space:pre-wrap;word-wrap:break-word;min-width:0}
.msg .bub small{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:2px}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg.me .bub{background:var(--ink);color:#fff;border-radius:18px 18px 6px 18px}
.msg time{font-size:10px;color:var(--muted);flex:none;padding-bottom:4px}
.chat-form{display:flex;gap:8px;padding-top:10px;border-top:1px solid var(--soft);flex:none}
.chat-form input{flex:1;height:48px;border-radius:999px;background:var(--soft);border:0;padding:0 18px;font-size:16px;outline:0;min-width:0}
.chat-form button{width:48px;height:48px;border-radius:50%;background:var(--green);display:grid;place-items:center;flex:none}

/* profile */
.p-hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:6px 0 4px}
.p-hero .avatar{width:96px;height:96px;font-size:32px}
.p-photo{position:relative}
.p-photo .cam{position:absolute;right:0;bottom:0;width:32px;height:32px;border-radius:50%;background:var(--ink);border:3px solid #fff;display:grid;place-items:center}
.p-hero h2{margin:12px 0 2px;font-size:24px;font-weight:700;letter-spacing:-.02em}
.p-hero p{margin:0;color:var(--muted);font-size:14px}
.p-hero .bio{color:var(--ink);margin-top:8px;font-size:15px;line-height:1.45;max-width:320px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.stat{background:var(--soft);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:22px;font-weight:700}
.stat span{font-size:12px;color:var(--muted)}
.invite{background:var(--ink);color:#fff;border-radius:18px;padding:18px;margin-top:18px}
.invite h4{margin:0;font-size:17px}
.invite p{margin:4px 0 12px;font-size:13px;color:#bdbdbd;line-height:1.4}
.invite .code{font-size:28px;font-weight:800;letter-spacing:.18em;margin-bottom:12px}
.invite .btn{height:44px;font-size:15px;border-radius:12px}
.invite .btn.secondary{background:#24463f;color:#fff}
.inline-form{display:flex;gap:8px}
.inline-form .field{height:48px;text-transform:uppercase;letter-spacing:.1em}
.inline-form .btn{height:48px;width:auto;padding:0 18px;font-size:15px;flex:none}
.prow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--soft);width:100%;text-align:left}
.prow:last-child{border-bottom:0}
.prow .avatar{width:44px;height:44px;font-size:15px}
.prow .pmain{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left}
.prow .pi{flex:1;min-width:0}
.prow strong{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .pi span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .acts{display:flex;gap:6px;flex:none}
.muted-s{font-size:14px;color:var(--muted);padding:6px 0}
.link-btn{font-size:14px;font-weight:600;text-decoration:underline;color:var(--muted)}

/* auth */
.auth{position:fixed;inset:0;z-index:1600;background:rgba(243,250,246,.7);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:flex-end;justify-content:center}
.auth-card{background:#fff;width:100%;max-height:100%;overflow-y:auto;padding:calc(28px + var(--safe-t)) 22px calc(24px + var(--safe-b));border-radius:26px 26px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.15);animation:up .35s cubic-bezier(.2,.8,.2,1)}
.logo{display:block;margin-bottom:18px}
.logo img{height:64px;width:auto;display:block}
.auth h1{margin:0;font-size:34px;line-height:1.05;font-weight:800;letter-spacing:-.03em}
.auth .lead{color:var(--muted);font-size:16px;line-height:1.5;margin:10px 0 18px}
.photo-pick{display:flex;align-items:center;gap:14px;background:var(--soft);border-radius:14px;padding:12px;width:100%;text-align:left}
.photo-pick .avatar{width:52px;height:52px;background:#d9d9d9;color:#fff}
.photo-pick strong{display:block;font-size:15px}
.photo-pick div span{font-size:13px;color:var(--muted)}
.fine{font-size:12px;color:var(--muted);line-height:1.5;margin:14px 0 0}
.switch-auth{text-align:center;margin-top:16px;font-size:15px;color:var(--muted)}
.switch-auth button{font-weight:700;color:var(--ink);text-decoration:underline}
.setup ol{padding-left:20px;line-height:1.6;font-size:15px}
.setup code{background:var(--soft);padding:2px 6px;border-radius:6px;font-size:13px}

/* accessibility + venues */
.acc-list{display:flex;flex-wrap:wrap;gap:6px}
.acc{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600}
.opt3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt3 button{border-radius:14px;background:var(--soft);padding:10px 6px;border:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.opt3 button i{font-style:normal;font-size:22px;line-height:1.1}
.opt3 button b{font-size:13px}
.opt3 button small{font-size:11px;color:var(--muted);line-height:1.2}
.opt3 button.on{border-color:var(--ink);background:#fff}
.venue-link{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-top:12px}
.venue-link .vi{width:40px;height:40px;border-radius:10px;background:var(--soft);display:grid;place-items:center;font-size:20px;flex:none}
.venue-link div{flex:1;min-width:0}
.venue-link strong{display:block;font-size:15px}
.venue-link span{display:block;font-size:13px;color:var(--muted)}
.vbadge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 11px;font-size:13px;font-weight:700;background:var(--soft)}
.vbadge.open{background:#dff3e8;color:var(--green-d)}
.vbadge.open::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--green)}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.mgr{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--muted);margin-top:12px;line-height:1.35}
.mgr b{color:var(--ink)}
.mgr .btn{flex:none}
.week{margin:2px 0 4px}
.wk-row{display:grid;grid-template-columns:40px 1fr;align-items:center;gap:8px;height:30px}
.wk-row b{font-size:13px;font-weight:600}
.wk-row.today b{color:var(--green-d)}
.wk-track{position:relative;height:20px;background:var(--soft);border-radius:6px}
.wk-track span{position:absolute;top:0;bottom:0;background:var(--ink);border-radius:6px;color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;min-width:6px}
.wk-row.today .wk-track span{background:var(--green-d)}
.wk-axis{display:grid;grid-template-columns:40px 1fr;gap:8px;font-size:10px;color:var(--muted);margin-top:2px}
.wk-axis div{display:flex;justify-content:space-between}
.slot-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--soft);font-size:14px}
.slot-row div{flex:1;min-width:0}
.slot-row span{display:block;font-size:12px;color:var(--muted)}
.ptable{width:100%;border-collapse:collapse;font-size:15px}
.ptable td{padding:11px 0;border-bottom:1px solid var(--soft);vertical-align:middle}
.ptable td.pp{text-align:right;font-weight:700;white-space:nowrap;padding-left:10px}
.ptable td.pe{width:1%;padding-left:8px}
.ptable small{display:block;color:var(--muted);font-size:12px;font-weight:500}
.mini{font-size:13px;font-weight:600;text-decoration:underline;color:var(--muted);white-space:nowrap}
.checked{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted);margin-top:8px}

/* onboarding (welcome, age, profile, safety) */
.ob-steps{display:flex;gap:6px;margin:0 0 22px}
.ob-steps i{flex:1;height:5px;border-radius:9px;background:var(--soft2)}
.ob-steps i.on{background:var(--green)}
.age-in{display:flex;align-items:center;justify-content:center;gap:14px;margin:26px 0 8px}
.age-in input{width:150px;height:96px;border-radius:20px;border:2px solid var(--line);background:var(--mint);font-size:52px;font-weight:900;text-align:center;color:var(--ink);outline:0;-moz-appearance:textfield}
.age-in input::-webkit-outer-spin-button,.age-in input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.age-in input:focus{border-color:var(--green);background:#fff}
.age-in span{font-size:18px;font-weight:700;color:var(--muted)}
.stop-ic{font-size:54px;line-height:1;margin:8px 0 14px}
.tips{display:flex;flex-direction:column;gap:10px;margin:6px 0 4px}
.tip{display:flex;gap:12px;align-items:flex-start;background:var(--mint);border-radius:14px;padding:12px 14px}
.tip i{font-style:normal;font-size:22px;line-height:1.2;flex:none}
.tip b{display:block;font-size:15px}
.tip span{display:block;font-size:13px;color:var(--muted);line-height:1.4;margin-top:1px}
.pledge{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;margin-top:16px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);font-size:14px;line-height:1.4}
.pledge .box{width:24px;height:24px;border-radius:7px;border:2px solid var(--muted);flex:none;display:grid;place-items:center;color:#fff;font-weight:900;font-size:15px}
.pledge.on{border-color:var(--green);background:var(--mint)}
.pledge.on .box{background:var(--green);border-color:var(--green)}
.welcome-hero{background:var(--green);border-radius:22px;padding:26px 22px 22px;margin:-6px 0 18px;color:#fff}
.welcome-hero img{height:58px;width:auto;display:block;margin-bottom:16px}
.welcome-hero h1{color:#fff}
.welcome-hero p{margin:10px 0 0;font-size:16px;line-height:1.5;color:#eafaf2}
.welcome-cats{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.welcome-cats span{background:rgba(255,255,255,.16);border-radius:999px;padding:5px 10px;font-size:13px;font-weight:700}

/* safety */
.safe-note{display:flex;gap:10px;align-items:flex-start;background:var(--sun-soft);border-radius:12px;padding:10px 12px;margin-top:12px;font-size:13px;line-height:1.4;color:#5c4300}
.safe-note i{font-style:normal;font-size:17px;flex:none}
.safe-note b{color:#3d2c00}
.feel{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.feel button{border-radius:14px;background:var(--soft);padding:12px 4px;border:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-weight:700}
.feel button i{font-style:normal;font-size:26px;line-height:1.1}
.feel button.on{border-color:var(--green);background:#fff}
.help-box{background:var(--soft);border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.5;margin-top:12px}
.help-box b{display:block;font-size:14px}
.help-box a{font-weight:800;color:var(--green-d)}
.reason{display:block;width:100%;text-align:left;padding:14px;border-radius:12px;background:var(--soft);margin-top:8px;font-weight:700;font-size:15px;border:2px solid transparent}
.reason.on{border-color:var(--green);background:#fff}
.text-link{font-size:14px;font-weight:700;color:var(--muted);text-decoration:underline;padding:8px 0}
.approx{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin-top:4px}
.pin.approx-pin{opacity:.92}
.pin.approx-pin::before{content:"";position:absolute;inset:-14px;border-radius:50%;background:rgba(30,158,106,.13);border:2px dashed rgba(30,158,106,.5);z-index:-2}

/* badges + streaks */
.streak{display:flex;align-items:center;gap:14px;background:var(--sun-soft);border-radius:18px;padding:14px 16px;margin-top:14px}
.streak .fl{font-size:34px;line-height:1}
.streak b{display:block;font-size:18px;font-weight:900}
.streak span{font-size:13px;color:#5c4300}
.badge-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bdg{background:var(--soft);border-radius:16px;padding:12px 6px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.bdg .bi{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:#fff;box-shadow:inset 0 0 0 2px var(--line)}
.bdg.got .bi{background:var(--sun);box-shadow:0 2px 8px rgba(255,201,77,.6)}
.bdg:not(.got) .bi{filter:grayscale(1);opacity:.45}
.bdg b{font-size:12px;line-height:1.2}
.bdg small{font-size:10.5px;color:var(--muted);line-height:1.25}
.toast.gold{background:var(--sun);color:var(--ink)}

/* reviews + photos */
.stars{display:inline-flex;gap:1px;color:var(--sun);letter-spacing:0;font-size:15px;line-height:1}
.stars .off{color:#d4ddd8}
.rating-sum{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.rating-sum .big{font-size:34px;font-weight:900;line-height:1}
.rating-sum span{font-size:13px;color:var(--muted)}
.review{padding:12px 0;border-bottom:1px solid var(--soft)}
.review:last-child{border-bottom:0}
.review .rh{display:flex;align-items:center;gap:10px}
.review .rh .avatar{width:32px;height:32px;font-size:11px}
.review .rh div{flex:1;min-width:0}
.review .rh strong{display:block;font-size:14px}
.review .rh small{font-size:12px;color:var(--muted)}
.review p{margin:8px 0 0;font-size:14px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word}
.review img{display:block;margin-top:8px;width:100%;max-height:220px;object-fit:cover;border-radius:12px}
.gallery{display:flex;gap:8px;overflow-x:auto;margin:14px -20px 0;padding:0 20px;scrollbar-width:none}
.gallery::-webkit-scrollbar{display:none}
.gallery img{height:110px;width:150px;object-fit:cover;border-radius:12px;flex:none}
.star-pick{display:flex;gap:6px;justify-content:center;margin:6px 0 2px}
.star-pick button{font-size:38px;line-height:1;color:#d4ddd8}
.star-pick button.on{color:var(--sun)}
.photo-add{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--soft);border-radius:14px;padding:12px;margin-top:8px}
.photo-add img{width:64px;height:64px;object-fit:cover;border-radius:10px}
.photo-add .ph{width:64px;height:64px;border-radius:10px;background:var(--soft2);display:grid;place-items:center;font-size:24px}

/* comfort settings */
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
html.big .sheet,html.big .modal,html.big .topbar,html.big .place-bar,html.big .auth-card,html.big .toast,html.big .spot-drop,html.big .locate{zoom:1.15}
html.big .modal{max-height:80vh}
html.big .sheet{max-height:73vh}
html.contrast{--muted:#333;--line:#7a7a7a;--soft:#ececec;--soft2:#dedede}
html.contrast .chip,html.contrast .field,html.contrast .pill-btn,html.contrast .act-opt,html.contrast .opt3 button,html.contrast .acc,html.contrast .tag,html.contrast .btn.secondary,html.contrast .seg{box-shadow:inset 0 0 0 1.5px var(--ink)}
html.contrast .chip.on,html.contrast .tag.dark{box-shadow:none}
html.contrast .leaflet-tile-pane{filter:contrast(1.15) saturate(.9)}
html.calm *,html.calm *::before,html.calm *::after{animation:none!important;transition:none!important}
html.calm .pin.live::before{display:none}

.toast{position:fixed;z-index:2000;left:50%;top:calc(76px + var(--safe-t));transform:translate(-50%,-20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:all .25s;box-shadow:var(--shadow);max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.spinner{width:22px;height:22px;border-radius:50%;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media (max-width:899px){.leaflet-control-zoom{display:none}}
@media (min-width:900px){
  .topbar{left:436px;right:20px;top:20px}
  .leaflet-top{top:0}
  .sheet{left:20px;top:20px;bottom:20px;right:auto;width:400px;max-height:none;border-radius:22px;padding:20px;box-shadow:var(--shadow)}
  .sheet .handle,#toggleList{display:none}
  .sheet .seg{display:flex!important}
  .sheet .list{display:block!important}
  .chips{margin:0 -20px 10px;padding:0 20px}
  .list{margin:0 -20px;padding:2px 20px 8px}
  .locate{bottom:30px!important;right:20px}
  .leaflet-bottom.leaflet-right{margin-right:84px}
  .modal,.place-bar{left:20px;right:auto;top:20px;bottom:20px;width:400px;border-radius:22px;max-height:calc(100vh - 40px)}
  .place-bar{top:auto}
  .modal.chat-mode{height:auto}
  .modal .grab{display:none}
  .modal{padding-top:20px}
  .form-foot{bottom:-20px}
  .scrim{background:rgba(0,0,0,.18)}
  .toast{left:calc(50% + 210px)}
  .spot-drop{left:436px;right:20px;top:86px;margin:0}
  /* zoom scales insets too, so divide to keep the panels flush with the window */
  html.big .sheet,html.big .modal{top:calc(20px / 1.15);bottom:auto;height:calc((100vh - 40px) / 1.15);max-height:none}  .auth{align-items:center}
  .auth-card{width:440px;border-radius:26px;max-height:calc(100vh - 40px);padding:32px 30px}
}
</style>
</head>
<body>

      <span class="brand"><img src="brand/pinnit-pin-green.svg" alt="Pinnit"></span>

      <input id="q" type="search" placeholder="Search a park, venue or suburb" autocomplete="off" enterkeyhint="search">
    </div>
    <div id="results" class="results hidden"></div>
  </div>

</header>

<button id="locateBtn" class="round locate" aria-label="Show my location">

/* Basemap: OpenFreeMap vector tiles (free, no API key, no request limits), drawn by MapLibre GL

const BASEMAP = {
  style: 'https://tiles.openfreemap.org/styles/positron',
  js: ['https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js', 'https://cdn.jsdelivr.net/npm/@maplibre/maplibre-gl-leaflet@0.1.4/leaflet-maplibre-gl.js'],

async function pinnitStyle() {

  if (!r.ok) throw new Error('Map style ' + r.status);
  const s = await r.json();
  const recolour = (id, color) => { const l = s.layers.find(x => x.id === id); if (l) l.paint['fill-color'] = color; };
  recolour('park', '#d7ebd0'); recolour('landcover_wood', '#d0e6c8'); recolour('water', '#b9d5e8');
  const at = s.layers.findIndex(l => l.id === 'building');

    { id: 'pinnit-grass', type: 'fill', source: 'openmaptiles', 'source-layer': 'landcover', filter: ['==', ['get', 'class'], 'grass'], paint: { 'fill-color': '#ddeed6' } },
    { id: 'pinnit-sport', type: 'fill', source: 'openmaptiles', 'source-layer': 'landuse', filter: ['in', ['get', 'class'], ['literal', ['pitch', 'playground', 'track', 'stadium']]], paint: { 'fill-color': '#c4e2bf', 'fill-outline-color': '#9fcb98' } });

(async function initBasemap() {

    if (fellBack) return; fellBack = true;
    console.warn('Vector map unavailable, using raster tiles:', why);
    if (vector) map.removeLayer(vector);
    document.documentElement.classList.add('raster-map');
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

  if (!webglOK()) return fallback('no WebGL');
  const timer = setTimeout(() => fallback('timed out'), 12000);
  try {
    const css = document.createElement('link'); css.rel = 'stylesheet'; css.href = BASEMAP.css; document.head.appendChild(css);
    const [style] = await Promise.all([pinnitStyle(), (async () => { for (const src of BASEMAP.js) await loadScript(src); })()]);
    if (fellBack) return;
    vector = L.maplibreGL({ style }).addTo(map);
    const gl = vector.getMaplibreMap();
    gl.once('load', () => clearTimeout(timer));
    gl.on('error', e => { if (!gl.isStyleLoaded()) { clearTimeout(timer); fallback(e.error || e); } });
  } catch (e) { clearTimeout(timer); fallback(e); }
})();

function focusOn(latlng, zoom = 15) {

function normaliseEvent(e) {
  const players = (e.participants || []).map(p => ({ ...p, profile: p.profile || { id: p.user_id, display_name: 'Member' } }))
    .sort((a, b) => (a.user_id === e.host_id ? -1 : b.user_id === e.host_id ? 1 : new Date(a.joined_at) - new Date(b.joined_at)));
  players.forEach(p => S.people.set(p.user_id, p.profile));
  if (e.host) S.people.set(e.host.id, e.host);
  return { ...e, players, age_brackets: e.age_brackets || [], access: e.access || [] };
}
const isIn = e => !!S.user && e.players.some(p => p.user_id === S.user.id);
const isHost = e => !!S.user && e.host_id === S.user.id;
// Safety: the pin shows the public place, but the exact meeting point and directions stay hidden
// until you join. (Pins used to be nudged up to 150 m, which put some on railway lines.)
const exactFor = e => isIn(e) || isHost(e);

function eligibility(e, me = S.me) {
  if (isHost(e)) return { ok: true, text: 'You are hosting' };
  if (statusOf(e) === 'ended') return { ok: false, text: 'This event has finished' };
  if (!me || !me.age_bracket) return { ok: false, text: 'Add your age range to join' };
  if (e.gender_rule === 'women' && me.gender !== 'woman') return { ok: false, text: 'This event is for women only' };
  if (e.gender_rule === 'women_nb' && !['woman', 'non_binary'].includes(me.gender)) return { ok: false, text: 'For women and non-binary people' };
  if (e.gender_rule === 'men' && me.gender !== 'man') return { ok: false, text: 'This event is for men only' };
  if (e.age_brackets.length && !e.age_brackets.includes(me.age_bracket)) return { ok: false, text: `For ages ${agesLabel(e.age_brackets)}` };
  if (!isIn(e) && e.players.length >= e.max_people) return { ok: false, text: 'This event is full' };
  return { ok: true, text: 'You can join' };
}
function filterCount() {
  const f = S.filters;
  return (f.when !== 'any') + f.eligible + (f.ages.length > 0) + (f.rule !== 'any') + f.friends + f.free + (f.noise !== 'any') + f.access.length;
}

/* venues */
function normaliseVenue(v) {
  const prices = (v.venue_prices || []).slice().sort((a, b) => (+a.price) - (+b.price));
  const slots = (v.venue_slots || []).slice().sort((a, b) => toMins(a.start_time) - toMins(b.start_time));
  if (v.manager) S.people.set(v.manager.id, v.manager);
  const reviews = (v.venue_reviews || []).slice().sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
  reviews.forEach(r => { if (r.author) S.people.set(r.author.id, r.author); });
  const rating = reviews.length ? reviews.reduce((s, r) => s + r.rating, 0) / reviews.length : 0;
  return { ...v, access: v.access || [], prices, slots, reviews, rating };
}
const isManager = v => !!S.user && v.manager_id === S.user.id;
const canEditVenue = v => !!S.user && (v.manager_id === S.user.id || v.created_by === S.user.id);

}
function venueHoursLabel(v) {

  if (cur) return `Open for community use · until ${fmtMins(toMins(cur.end_time))}`;
  const m = now.getHours() * 60 + now.getMinutes();
  const later = slotsOn(v, now.getDay()).find(s => toMins(s.start_time) > m);
  if (later) return `Community use from ${fmtMins(toMins(later.start_time))} today`;
  for (let i = 1; i < 7; i++) {
    const dow = (now.getDay() + i) % 7, s = slotsOn(v, dow)[0];
    if (s) return `Community use ${i === 1 ? 'tomorrow' : DAYS[dow]} from ${fmtMins(toMins(s.start_time))}`;
  }

}

function fromPrice(v) {

}
function venueFor(e) {

function nearestVenue(ll, maxKm) {

  return best;
}
function visibleVenues() {

    .filter(v => (S.vkind === 'all' || v.kind === S.vkind) && (!S.vOpenNow || openNow(v)))
    .map(v => ({ ...v, _dist: km(ref, [v.lat, v.lng]) }))
    .sort((a, b) => a._dist - b._dist);
}
function visibleEvents() {
  const now = Date.now(), f = S.filters;
  const endToday = new Date(); endToday.setHours(23, 59, 59, 999);
  const dow = new Date().getDay();
  const sat = new Date(); sat.setHours(0, 0, 0, 0); sat.setDate(sat.getDate() + (dow === 0 ? -1 : 6 - dow));
  const sunEnd = new Date(sat); sunEnd.setDate(sat.getDate() + 1); sunEnd.setHours(23, 59, 59, 999);
  const ref = S.userPos || [map.getCenter().lat, map.getCenter().lng];

  if (S.tab === 'mine') {

  } else {
    list = list.filter(e => {
      if (S.cats.size && !S.cats.has(catOf(e))) return false;
      const s = startMs(e), st = statusOf(e, now);
      if (f.when === 'now' && !(st === 'live' || s - now < 30 * 60000)) return false;
      if (f.when === 'today' && s > +endToday) return false;
      if (f.when === 'weekend' && !((s >= +sat && s <= +sunEnd) || (st === 'live' && (dow === 0 || dow === 6)))) return false;
      if (f.when === 'week' && s > now + 7 * 864e5) return false;
      if (f.eligible && !(isIn(e) || eligibility(e).ok)) return false;
      if (f.ages.length && e.age_brackets.length && !e.age_brackets.some(a => f.ages.includes(a))) return false;
      if (f.rule !== 'any' && e.gender_rule !== f.rule) return false;
      if (f.friends && !friendsIn(e).length) return false;
      if (f.free && +e.cost > 0) return false;

    });

}
function closeAll(force) {

  hideModal();
}

function resizeImage(file, size) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(img.width, img.height), c = document.createElement('canvas');
      c.width = c.height = size;
      c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? resolve(b) : reject(new Error('Could not read that image')), 'image/jpeg', 0.85);
    };
    img.onerror = () => reject(new Error('Could not read that image'));
    img.src = url;
  });
}

/* session handling */
async function handleSession(session) {
  if (!session) {
    if (S.user) teardown();
    showAuth();
    return;
  }
  if (S.user && S.user.id === session.user.id) return;
  S.user = session.user;
  hideAuth();
  let prof = null;
  for (let i = 0; i < 5 && !prof; i++) { try { prof = await api.myProfile(S.user.id); } catch (e) { console.error(e); } if (!prof) await new Promise(r => setTimeout(r, 700)); }
  S.me = prof || { id: S.user.id, display_name: (S.user.user_metadata || {}).display_name || 'Member', gender: 'prefer_not', age_bracket: null };
  if (authState.photo) {
    try { const url = await api.uploadAvatar(S.user.id, authState.photo); S.me = await api.updateProfile(S.user.id, { avatar_url: url }); } catch (e) { console.error(e); }
    authState.photo = null; authState.photoUrl = '';
  }
  S.people.set(S.me.id, S.me);
  if (location.hash.includes('access_token')) history.replaceState(null, '', location.pathname + location.search);
  if (S.globalUnsub) S.globalUnsub();
  S.globalUnsub = api.subscribeGlobal(onGlobalChange);
  await loadAll();
  if (!S.me.age_bracket) push('editProfile', { locked: true, onboarding: true });
  else if (store.get('pinnit_pending_photo', false) && !S.me.avatar_url) { store.del('pinnit_pending_photo'); toast('Add your profile photo from your profile'); }
  const shared = store.get('pinnit_open_event', null);
  if (shared) { store.del('pinnit_open_event'); if (S.events.some(e => e.id === shared)) openEvent(shared); else toast('That event has finished'); }
  store.del('pinnit_ref');
}
function teardown() {

  Object.assign(S, { user: null, me: null, events: [], friends: new Map(), people: new Map(), tab: 'explore', recent: null });

/* live event channel: chat + check-ins */
function ensureEventLive(id) {
  if (S.eventSub && S.eventSub.id === id) return;
  clearEventLive();
  const unsub = api.subscribeEvent(id, (kind, p) => {
    if (kind === 'message') onMessage(p.new);
    if (kind === 'checkin') refreshCheckins(id);
  });
  S.eventSub = { id, unsub };
  refreshCheckins(id);
}
function clearEventLive() {
  const top = S.stack[S.stack.length - 1];
  if (top && ['event', 'chat'].includes(top.kind)) return;
  if (S.eventSub) { S.eventSub.unsub(); S.eventSub = null; }
  checkinLayer.clearLayers();
}
async function refreshCheckins(id) {
  try {
    const rows = await api.checkins(id);
    if (!S.eventSub || S.eventSub.id !== id) return;
    checkinLayer.clearLayers();
    rows.filter(r => Date.now() - new Date(r.updated_at) < 3 * 3600e3).forEach(r => {
      const p = S.people.get(r.user_id) || { display_name: 'Member' };
      const icon = L.divIcon({ className: '', iconSize: [60, 58], iconAnchor: [30, 20], html: `<div class="ci-mark">${avatar(p)}<span>${esc(r.user_id === S.user.id ? 'You' : first(p.display_name))}</span></div>` });
      L.marker([r.lat, r.lng], { icon, interactive: false, zIndexOffset: 1000 }).addTo(checkinLayer);
    });
  } catch (e) { console.error(e); }
}
function startSharing(id) {
  if (!navigator.geolocation) return toast('Location is not available on this device');
  stopSharing(true);
  const e = S.events.find(x => x.id === id);
  S.sharing = { eventId: id, watchId: null, last: 0 };
  const send = pos => {
    if (!S.sharing || S.sharing.eventId !== id) return;
    const now = Date.now();
    if (now - S.sharing.last < 15000) return;
    S.sharing.last = now;

/* =====================================================================
   PUBLIC SPACE CHECK
   Pins can only go in parks, courts, plazas and public venues, never homes or railways.

const spotRules = import('./spot-rules.js');
const spotCache = new Map();
// throws if the map data can't be loaded: we never guess
async function checkSpot(lat, lng) {
  const key = lat.toFixed(5) + ',' + lng.toFixed(5);
  if (spotCache.has(key)) return spotCache.get(key);
  const res = await (await spotRules).checkSpot(lat, lng);
  spotCache.set(key, res);
  return res;
}
async function nearbySpaces(lat, lng) { return (await spotRules).nearbySpaces(lat, lng); }
// the same edge-of-map helper is still used for search and address lookups
function withTimeout(signal, ms) {
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(new DOMException('Timed out', 'TimeoutError')), ms);
  if (signal) { if (signal.aborted) ctl.abort(signal.reason); else signal.addEventListener('abort', () => ctl.abort(signal.reason), { once: true }); }
  return { signal: ctl.signal, done: () => clearTimeout(t) };
}

let geoTimer;
async function reverseGeocode(lat, lng, signal) {

    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&addressdetails=1&lat=${lat}&lon=${lng}`, { signal: to.signal, headers: { 'Accept-Language': 'en-AU' } });
    const d = await r.json(), a = d.address || {};
    return {
      main: d.name || a.leisure || a.amenity || a.park || a.road || a.pedestrian || a.footway || '', area: a.suburb || a.neighbourhood || a.town || a.city_district || a.city || ''
    };
  } catch (e) { if (e.name === 'AbortError') throw e; return { main: '', area: '' }; }

}

const areaCache = new Map();

function lookupArea(p, c) {
  const key = c.lat.toFixed(3) + ',' + c.lng.toFixed(3);
  const apply = area => { if (S.placing !== p || p.latlng !== c) return; p.area = area; p.place = joinPlace(p.name || p.addrMain, area) || p.place; $('#placeName').textContent = p.place; };
  if (areaCache.has(key)) return apply(areaCache.get(key));
  clearTimeout(areaTimer);
  areaTimer = setTimeout(async () => {
    const addr = await reverseGeocode(c.lat, c.lng).catch(() => ({ main: '', area: '' }));
    if (addr.area) areaCache.set(key, addr.area);
    p.addrMain = addr.main;

  }, 900);   // Nominatim asks for no more than one lookup a second
}

  $('#confirmPlace').disabled = true;
  clearTimeout(geoTimer);
  if (!sydBounds.contains(c)) { $('#placeName').textContent = 'Pinnit is Sydney only for now'; renderSpot(null); return; }
  $('#placeName').textContent = 'Checking this spot…';
  renderSpot('checking');
  geoTimer = setTimeout(async () => {
    // a place already on Pinnit counts as a checked public space
    const known = nearestVenue([c.lat, c.lng], p.mode === 'venue' ? 0.04 : 0.05);
    let spot;
    if (known) spot = p.mode === 'venue' ? { ok: false, reason: 'exists', venue: known } : { ok: true, kind: known.kind, name: known.name, venue: known };
    else spot = await checkSpot(c.lat, c.lng).catch(e => { console.warn('Public space check unavailable', e); return { ok: false, reason: 'unavailable' }; });
    if (S.placing !== p || p.latlng !== c) return;
    // the map may have moved on without a moveend yet (e.g. mid-animation): never show a stale answer
    if (map.getCenter().distanceTo(c) > 2) return updatePlace();
    p.spot = spot; p.venue = spot.venue && spot.ok ? spot.venue : null;
    p.name = spot.ok ? spot.name : '';
    p.place = p.name || `${c.lat.toFixed(4)}, ${c.lng.toFixed(4)}`;
    $('#placeName').textContent = spot.ok ? p.place : spot.reason === 'exists' ? spot.venue.name : spot.reason === 'rail' ? 'Railway' : spot.reason === 'residential' ? 'Homes' : 'Not a public space';
    $('#confirmPlace').disabled = !spot.ok;

    }

}

  v.slots.forEach(s => { lo = Math.min(lo, Math.floor(toMins(s.start_time) / 60) * 60); hi = Math.max(hi, Math.ceil(toMins(s.end_time) / 60) * 60); });
  const span = hi - lo, today = new Date().getDay();
  const rows = WEEK_ORDER.map(d => `<div class="wk-row ${d === today ? 'today' : ''}"><b>${DAYS[d]}</b><div class="wk-track">${slotsOn(v, d).map(s => {
    const a = toMins(s.start_time), b = toMins(s.end_time);
    return `<span style="left:${(a - lo) / span * 100}%;width:${(b - a) / span * 100}%" title="${fmtMins(a)}–${fmtMins(b)}">${b - a >= 180 ? `${fmtMins(a)}–${fmtMins(b)}` : ''}</span>`;
  }).join('')}</div></div>`).join('');
  return `<div class="week" aria-hidden="true">${rows}<div class="wk-axis"><span></span><div><span>${fmtMins(lo)}</span><span>${fmtMins(lo + span / 2)}</span><span>${fmtMins(hi)}</span></div></div></div>`;
}

const BADGES = [
  { id: 'first', e: '📍', label: 'First pin', sub: 'Join your first event', test: p => p.joined >= 1 },
  { id: 'host', e: '🌱', label: 'Host', sub: 'Start your own event', test: p => p.hosted >= 1 },

// weeks start on Monday; an event counts towards a week once it has started, or if it's this week
function weekStart(ms) { const d = new Date(ms); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return +d; }
function weekBefore(ms) { const d = new Date(ms); d.setDate(d.getDate() - 7); return weekStart(+d); }
function computeProgress(history, reviews, places = 0) {
  const now = Date.now(), thisWeek = weekStart(now);
  const weeks = new Set(history.map(h => +new Date(h.starts_at)).filter(s => s <= now || weekStart(s) === thisWeek).map(weekStart));
  let w = weeks.has(thisWeek) ? thisWeek : weekBefore(thisWeek), streak = 0;
  while (weeks.has(w)) { streak++; w = weekBefore(w); }
  const p = {
    history, reviews, places, streak, thisWeek: weeks.has(thisWeek),
    joined: history.filter(h => !h.hosted).length, hosted: history.filter(h => h.hosted).length,
    arrived: history.filter(h => h.arrived).length,
    cats: new Set(history.map(h => h.category || actOf(h.activity).cat)).size,
    friends: [...S.friends.values()].filter(f => f.status === 'accepted').length
  };
  p.got = BADGES.filter(b => b.test(p)).map(b => b.id);
  return p;
}
function progressHtml(p) {
  return `<div class="streak"><span class="fl">${p.streak ? '🔥' : '🌱'}</span><div><b>${p.streak ? `${p.streak}-week streak` : 'Start a streak'}</b><span>${p.streak ? (p.thisWeek ? "You've got something on this week. Nice one." : 'Join something this week to keep it going.') : 'Do something with people each week to build a streak.'}</span></div></div>
    <div class="sec-t">Badges · ${p.got.length} of ${BADGES.length}</div>
    <div class="badge-grid">${BADGES.map(b => `<div class="bdg ${p.got.includes(b.id) ? 'got' : ''}"><div class="bi" aria-hidden="true">${b.e}</div><b>${b.label}</b><small>${p.got.includes(b.id) ? 'Unlocked' : b.sub}</small></div>`).join('')}</div>`;
}
let progressBusy = false;
const safetyAsked = new Set();
async function refreshProgress() {
  if (!api || !api.history || !S.user || progressBusy) return;
  progressBusy = true;
  try {
    const [history, reviews, seen, checks, places] = await Promise.all([api.history(), api.reviewCount(), api.seenBadges(), api.safetyChecks(), api.placesCount ? api.placesCount() : 0]);
    const p = computeProgress(history, reviews, places);
    S.progress = p;
    const fresh = p.got.filter(id => !seen.includes(id));
    if (fresh.length) {
      await api.markBadges(fresh);
      const b = BADGES.find(x => x.id === fresh[0]);
      setTimeout(() => toast(`${b.e} Badge unlocked: ${b.label}`, true), 1200);
    }
    // a private "did you feel safe?" check-in after each event you went to (up to 3 days later)
    const endOf = h => +new Date(h.starts_at) + (h.duration_mins || 60) * 60000;
    const due = history.filter(h => endOf(h) < Date.now() && Date.now() - endOf(h) < 3 * 864e5 && !checks.some(c => c.event_id === h.id) && !safetyAsked.has(h.id));
    if (due.length && !S.stack.length && !S.placing) { safetyAsked.add(due[0].id); push('feelSafe', { ev: due[0] }); }
    const top = S.stack[S.stack.length - 1];
    if (top && top.kind === 'profile') renderModal(true);
  } catch (e) { console.error(e); }
  finally { progressBusy = false; }
}

async function run(fn, okMsg) {
  const btns = $$('#modal .btn'); btns.forEach(b => b.disabled = true);
  try { await fn(); if (okMsg) toast(okMsg); await loadAll(); }
  catch (e) { console.error(e); toast(friendlyError(e)); await loadAll(); }
  finally { $$('#modal .btn').forEach(b => { if (!b.matches('[disabled][data-keepdisabled]')) b.disabled = false; }); renderModal(true); }
}
async function shareEvent(id) {
  const e = S.events.find(x => x.id === id); if (!e) return;
  const url = `${location.origin}${location.pathname}?event=${encodeURIComponent(e.id)}`;
  const text = `${iconOf(e)} ${labelOf(e)} at ${e.place.split(',')[0]}, ${whenLabel(e)}. Join me on Pinnit`;
  if (navigator.share) { try { await navigator.share({ title: 'Pinnit', text, url }); } catch {} return; }
  try { await navigator.clipboard.writeText(`${text} ${url}`); toast('Link copied'); } catch { prompt('Copy this link', url); }
}
async function shareInvite() {
  const url = `${location.origin}${location.pathname}?ref=${encodeURIComponent(S.me.referral_code)}`;
  const text = `Join me on Pinnit, local clubs, games and catch ups around Sydney. Use my code ${S.me.referral_code}`;
  if (navigator.share) { try { await navigator.share({ title: 'Pinnit', text, url }); } catch {} return; }
  try { await navigator.clipboard.writeText(`${text}: ${url}`); toast('Invite link copied'); } catch { prompt('Copy your invite link', url); }
}

      if (!d.days.length) return err('Pick at least one day');
      if (!d.start || !d.end || toMins(d.end) <= toMins(d.start)) return err('The end time needs to be after the start time');
      try { await api.addSlot({ venue_id: top.props.venueId, days: [...d.days].sort(), start_time: d.start, end_time: d.end, note: d.note.trim() || null }); toast('Community hours posted'); back(); await loadAll(); }
      catch (e) { err(friendlyError(e)); }
      return;
    }
  }
});

/* =====================================================================
   SEARCH, LOCATE, SHEET
   ===================================================================== */
let searchTimer, searchCtl;
$('#q').addEventListener('input', e => {
  const qv = e.target.value.trim(); clearTimeout(searchTimer);
  if (qv.length < 3) { $('#results').classList.add('hidden'); return; }
  searchTimer = setTimeout(() => runSearch(qv), 500);
});
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter') { clearTimeout(searchTimer); runSearch(e.target.value.trim()); } });
async function runSearch(qv) {
  if (!qv) return;
  searchCtl?.abort(); searchCtl = new AbortController();
  const [[s, w], [n, ea]] = SYDNEY.bounds;
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&countrycodes=au&bounded=1&viewbox=${w},${n},${ea},${s}&q=${encodeURIComponent(qv)}`, { signal: searchCtl.signal, headers: { 'Accept-Language': 'en-AU' } });
    const data = await r.json(), box = $('#results');
    box.innerHTML = data.length ? data.map(d => { const parts = d.display_name.split(','); return `<button data-go="${d.lat},${d.lon}"><span class="ric">${I.pin}</span><div><strong>${esc(parts[0])}</strong><span>${esc(parts.slice(1, 4).join(',').trim())}</span></div></button>`; }).join('') : '<div class="empty" style="padding:16px">No places found in Sydney</div>';
    box.classList.remove('hidden');
  } catch (e) { if (e.name !== 'AbortError') console.error(e); }
}
$('#results').addEventListener('click', e => {
  const b = e.target.closest('[data-go]'); if (!b) return;
  const [lat, lng] = b.dataset.go.split(',').map(Number);
  $('#results').classList.add('hidden'); $('#q').blur();
  if (S.placing) map.setView([lat, lng], 17); else focusOn([lat, lng], 15);
});
document.addEventListener('click', e => { if (!e.target.closest('.search')) $('#results').classList.add('hidden'); });

function locate(silent) {
  if (!navigator.geolocation) return silent || toast('Location not available');
  navigator.geolocation.getCurrentPosition(p => {
    const ll = [p.coords.latitude, p.coords.longitude];
    if (!sydBounds.contains(ll)) { if (!silent) toast("You look outside Sydney. Showing the city."); return; }
    S.userPos = ll;
    const icon = L.divIcon({ className: '', html: '<div class="me-dot"></div>', iconSize: [18, 18], iconAnchor: [9, 9] });
    if (meMarker) meMarker.setLatLng(ll); else meMarker = L.marker(ll, { icon, interactive: false, zIndexOffset: -100 }).addTo(map);
    if (!silent || !S.stack.length) focusOn(ll, 14);
    renderAll();
  }, () => { if (!silent) toast('Turn on location access to see what is near you'); }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
}
$('#locateBtn').addEventListener('click', () => locate(false));

function toggleSheet(force) {
  const s = $('#sheet'), on = force ?? !s.classList.contains('expanded');
  s.classList.toggle('expanded', on);
  $('#toggleList').textContent = on ? 'Show map' : 'View list';
  updateSheetHeight();
}
$('#sheet').addEventListener('click', e => {
  const c = e.target.closest('[data-cat]');
  if (c) { const id = c.dataset.cat; if (id === 'all') S.cats.clear(); else if (S.cats.has(id)) S.cats.delete(id); else S.cats.add(id); return renderAll(); }
  const vk = e.target.closest('[data-vkind]'); if (vk) { S.vkind = vk.dataset.vkind; return renderAll(); }
  if (e.target.closest('[data-vopen]')) { S.vOpenNow = !S.vOpenNow; return renderAll(); }
  const vv = e.target.closest('[data-venue]'); if (vv) return openVenue(vv.dataset.venue);
  if (e.target.closest('[data-filters]')) return push('filters', {});
  const tb = e.target.closest('[data-tab]'); if (tb) { S.tab = tb.dataset.tab; toggleSheet(true); return renderAll(); }
  const op = e.target.closest('[data-open]'); if (op) return openEvent(op.dataset.open);
});
// drag the handle (or the title row) up to open the list, down to show the map; a tap toggles it
(function sheetDrag() {
  const sheet = $('#sheet'), grips = [$('#sheetHandle'), $('.sheet-head')];
  let start = null, dy = 0, moved = false;
  const down = e => {
    if (isDesktop() || (e.target.closest('button') && e.target.id !== 'sheetHandle')) return;
    start = e.clientY; dy = 0; moved = false; sheet.classList.add('dragging');
    e.currentTarget.setPointerCapture?.(e.pointerId);
  };
  const move = e => {
    if (start == null) return;
    dy = e.clientY - start; if (Math.abs(dy) > 6) moved = true;
    const open = sheet.classList.contains('expanded');
    // follow the finger, with a little resistance past the ends
    const off = open ? Math.max(-20, dy) : Math.min(20, dy);
    sheet.style.transform = moved ? `translateY(${off > 0 ? off : off / 3}px)` : '';
  };
  const up = () => {
    if (start == null) return;
    sheet.classList.remove('dragging'); sheet.style.transform = '';
    const open = sheet.classList.contains('expanded');
    if (!moved) toggleSheet();
    else if (!open && dy < -40) toggleSheet(true);
    else if (open && dy > 60) toggleSheet(false);
    start = null;
  };
  grips.forEach(g => { g.addEventListener('pointerdown', down); g.addEventListener('pointermove', move); g.addEventListener('pointerup', up); g.addEventListener('pointercancel', up); });
})();
$('#toggleList').addEventListener('click', () => toggleSheet());
$('#dropBtn').addEventListener('click', () => {
  if (!S.me || !S.me.age_bracket) return push('editProfile', { locked: true, onboarding: true });
  S.draft = null; toggleSheet(false); startPlacing(null, S.tab === 'venues' ? 'venue' : 'event');
});
$('#confirmPlace').addEventListener('click', confirmPlacing);
$('#cancelPlace').addEventListener('click', () => { const had = S.draft && S.draft.loc; cancelPlacing(); if (had) push('create', {}); });
$('#profileBtn').addEventListener('click', () => { if (S.user) push('profile', {}); });
window.addEventListener('resize', updateSheetHeight);

/* =====================================================================
   BOOT
   ===================================================================== */
(async function boot() {
  const params = new URLSearchParams(location.search);
  if (params.get('ref')) store.set('pinnit_ref', params.get('ref').toUpperCase().slice(0, 8));
  if (params.get('event')) store.set('pinnit_open_event', params.get('event'));
  if (params.has('ref') || params.has('event')) history.replaceState(null, '', location.pathname + location.hash);
  updateSheetHeight();
  if (!configured) { showAuth(); return; }
  api = window.PINNIT_API_FACTORY();
  api.onAuth((event, session) => {
    if (event === 'PASSWORD_RECOVERY') { handleSession(session).then(() => push('newPassword', { locked: true })); return; }
    if (event === 'SIGNED_OUT') return handleSession(null);
    if (session) handleSession(session);
  });
  const session = await api.getSession();
  await handleSession(session);
  if (navigator.permissions?.query) {
    try { const p = await navigator.permissions.query({ name: 'geolocation' }); if (p.state === 'granted') locate(true); } catch {}
  }
})();
</script>
